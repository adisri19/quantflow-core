[package]
name = "quantflow-sdk"
version = "0.3.1"
edition = "2021"
description = "quantflow trading bot SDK for Rust"
license = "Apache-2.0"
repository = "https://github.com/quantflow-io/quantflow"
homepage = "https://quantflow.io"
documentation = "https://docs.quantflow.io"
readme = "README.md"
keywords = ["trading", "bot", "quantflow", "algorithmic-trading", "sdk"]
categories = ["development-tools", "api-bindings"]
authors = ["QuantFlow Team <support@quantflow.io>"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.14"
serial_test = "3.2"
