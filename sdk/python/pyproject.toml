[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantflow-sdk"
version = "0.3.1"
description = "SDK for building trading bots on quantflow platform"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "QuantFlow Team", email = "support@quantflow.io"}
]
keywords = ["trading", "bots", "algorithmic-trading", "quantflow", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://quantflow.io"
Documentation = "https://docs.quantflow.io"
Repository = "https://github.com/quantflow-io/quantflow"
"Source Code" = "https://github.com/quantflow-io/quantflow/tree/main/sdk/python"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantflow*"]
