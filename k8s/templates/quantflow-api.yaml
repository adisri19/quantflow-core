{{- if .Values.quantflowApi.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quantflow.fullname" . }}-api
  labels:
    {{- include "quantflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.quantflowApi.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: 30000
      {{- end }}
  selector:
    {{- include "quantflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quantflow.fullname" . }}-api
  labels:
    {{- include "quantflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.quantflowApi.replicas }}
  selector:
    matchLabels:
      {{- include "quantflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/chart-version: "{{ .Chart.Version }}"
      labels:
        {{- include "quantflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ .Values.quantflowApi.image.repository }}:{{ .Values.quantflowApi.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.quantflowApi.imagePullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.quantflowApi.port }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantflow.secretName" . }}
                  key: database-url
            - name: NATS_URLS
              value: {{ include "quantflow.natsUrl" . | quote }}
            - name: MINIO_ENDPOINT
              value: {{ include "quantflow.minioEndpoint" . | quote }}
            - name: MINIO_PORT
              value: {{ include "quantflow.minioPort" . | quote }}
            - name: MINIO_USE_SSL
              value: {{ include "quantflow.minioUseSSL" . | quote }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantflow.secretName" . }}
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantflow.secretName" . }}
                  key: minio-secret-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "quantflow.secretName" . }}
                  key: jwt-secret
            {{- range $key, $value := .Values.quantflowApi.env }}
            {{- if and (ne $key "JWT_SECRET") (ne $key "DATABASE_URL") (ne $key "MINIO_ACCESS_KEY") (ne $key "MINIO_SECRET_KEY") }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.quantflowApi.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.quantflowApi.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uploads
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
